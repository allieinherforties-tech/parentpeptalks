name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: HTML sanity + link/asset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep check.py and its embedded copy identical
        run: |
          python3 - <<'PY'
          import re
          import sys
          import textwrap
          from pathlib import Path

          workflow = Path(".github/workflows/check.yml").read_text(encoding="utf-8")
          match = re.search(
              r"- name: Validate HTML, meta, links, assets.*?<<'PY'\n(.*?)\n\s*PY\n",
              workflow, re.S)
          if not match:
              sys.exit("could not find the embedded check script in this workflow")
          embedded = textwrap.dedent(match.group(1)) + "\n"
          local = Path("check.py").read_text(encoding="utf-8")
          if embedded != local:
              sys.exit("check.py and the copy embedded in .github/workflows/check.yml"
                       " have drifted — update both together, byte-identical")
          print("check.py matches its embedded copy")
          PY

      - name: Validate HTML, meta, links, assets
        run: |
          python3 - <<'PY'
          """Static-site sanity check: HTML structure, meta parity, links/assets, no Airo refs.

          Lives here and, verbatim, inside .github/workflows/check.yml — the CI step
          above the check fails when the two copies drift, so update both together,
          byte-identical.
          """
          import json
          import re
          import sys
          from html.parser import HTMLParser
          from pathlib import Path

          # Split here so this scan does not flag its own source (and the workflow that
          # embeds it) as a live Airo reference.
