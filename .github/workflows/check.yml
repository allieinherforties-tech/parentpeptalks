                      # the inline script reads the query param and shows the nudge.
                      "data-form-status",
                      'params.get("status") !== "invalid"',
                      'href="styles.css"',
                      # Inline SVG lockup — standard variant (bone fold lines).
                      'class="logo-mark"',
