<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="canonical" href="https://parentpeptalks.com/signup">
    <title>Parent Pep Talks — Sign up for the daily notes</title>
    <meta name="description" content="Sign up free — one short note in your inbox every morning, starting tomorrow.">
    <meta property="og:title" content="Parent Pep Talks">
    <meta property="og:description" content="Sign up free — one short note in your inbox every morning, starting tomorrow.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://parentpeptalks.com/signup">
    <meta property="og:image" content="https://parentpeptalks.com/assets/hero.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Parent Pep Talks">
    <meta name="twitter:description" content="Sign up free — one short note in your inbox every morning, starting tomorrow.">
    <meta name="twitter:image" content="https://parentpeptalks.com/assets/hero.webp">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a href="./" class="logo" aria-label="Parent Pep Talks — home">
        <!-- Standard variant on bone: duck-gold ring, charcoal envelope,
             fold lines in the bone field color. -->
        <svg class="logo-mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
          <g fill="#e6da6f">
            <path d="M20.32 11.26A46 46 0 0 1 75.68 11.26L65.15 25.24A28.5 28.5 0 0 0 30.85 25.24Z"/>
            <path d="M84.74 20.32A46 46 0 0 1 84.74 75.68L70.76 65.15A28.5 28.5 0 0 0 70.76 30.85Z"/>
            <path d="M75.68 84.74A46 46 0 0 1 20.32 84.74L30.85 70.76A28.5 28.5 0 0 0 65.15 70.76Z"/>
            <path d="M11.26 75.68A46 46 0 0 1 11.26 20.32L25.24 30.85A28.5 28.5 0 0 0 25.24 65.15Z"/>
          </g>
          <rect x="28" y="35.5" width="40" height="25" rx="2" fill="#26211d"/>
          <g fill="none" stroke="#f5f1ea" stroke-width="3.25">
            <path d="M29.5 37.5L48 48L66.5 37.5"/>
            <path d="M29.5 58.5L48 48L66.5 58.5"/>
          </g>
        </svg>
        <span class="logo-word" aria-hidden="true">Parent Pep Talks</span>
      </a>
    </header>
    <main>
      <section class="signup signup-centered">
        <div class="signup-inner">
          <h1 class="signup-title">You're doing better than you think.</h1>
          <form data-kit-form>
            <div class="fields">
              <input type="text" name="firstName" placeholder="First name" aria-label="First name" autocomplete="given-name" required class="field first-name">
              <input type="email" name="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required class="field email">
            </div>
            <button type="submit" class="submit">Send me the notes</button>
            <p class="fine-print">Free. No spam. Unsubscribe whenever.</p>
          </form>
          <template data-kit-fallback>
            <a class="fallback-cta" href="https://parent-pep-talks.kit.com">Send me the notes</a>
          </template>
          <p class="form-status" data-form-status role="status" aria-live="polite" hidden></p>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <p class="footer-note">Made for the parents in the thick of it.</p>
      <p class="footer-copyright">© 2026 parentpeptalks.com</p>
    </footer>
    <script src="kit-form.js"></script>
  </body>
</html>
